name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A37DDC: ${{ secrets.A37DDC }}
          B9E34B: ${{ secrets.B9E34B }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A37DDC', '')
          sec_b = os.environ.get('B9E34B', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 1a6eb978b30c375cc909caa9bb1bcb4e232f9ddc41e6 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 7ca6dcf8bf91b360cbd81497b1b3 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
